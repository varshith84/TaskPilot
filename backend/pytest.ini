[pytest]
testpaths = tests
asyncio_mode = auto
log_cli = true
log_cli_level = WARNING
log_format = %(asctime)s %(levelname)s %(name)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    ignore::DeprecationWarning:starlette
    ignore::DeprecationWarning:fastapi
    ignore::DeprecationWarning:anyio
